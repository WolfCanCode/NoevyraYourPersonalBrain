name: Bump and Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version component to bump'
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

concurrency:
  group: bump-release
  cancel-in-progress: false

jobs:
  # ── 1. Calculate next version, commit, and tag ─────────────────────────────
  bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node 24)
        with:
          fetch-depth: 0        # required: we inspect all tags
          persist-credentials: true  # required: we push a commit + tag

      - name: Configure git author
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Calculate next version
        id: ver
        run: |
          # Find the latest semver tag (ignore pre-release suffixes for base)
          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -1)
          [ -z "$latest" ] && latest="v0.0.0"

          v="${latest#v}"
          major=$(echo "$v" | cut -d. -f1)
          minor=$(echo "$v" | cut -d. -f2)
          patch=$(echo "$v" | cut -d. -f3)

          case "${{ inputs.bump }}" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            *)     patch=$((patch+1)) ;;
          esac

          next="v${major}.${minor}.${patch}"
          plain="${major}.${minor}.${patch}"
          echo "tag=$next"   >> "$GITHUB_OUTPUT"
          echo "plain=$plain" >> "$GITHUB_OUTPUT"
          echo "Bumping $latest → $next (${{ inputs.bump }})"

      - name: Update version string in main.go
        run: |
          sed -i "s|var version = \"[^\"]*\"|var version = \"${{ steps.ver.outputs.plain }}-dev\"|" \
            cmd/brain/main.go
          grep 'var version' cmd/brain/main.go

      - name: Commit version bump
        run: |
          git add cmd/brain/main.go
          if git diff --staged --quiet; then
            echo "version string already up to date — no commit needed"
          else
            git commit -m "chore: bump version to ${{ steps.ver.outputs.tag }}"
          fi

      - name: Push commit and tag
        run: |
          git tag "${{ steps.ver.outputs.tag }}"
          git push origin HEAD:main
          git push origin "${{ steps.ver.outputs.tag }}"

  # ── 2. Build tested binaries for all platforms ────────────────────────────
  binaries:
    needs: bump
    uses: ./.github/workflows/binaries.yml
    with:
      version: ${{ needs.bump.outputs.tag }}

  # ── 3. Verify checksums and publish GitHub Release ────────────────────────
  publish:
    needs: [bump, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node 24)
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: brain-*
          path: release
          merge-multiple: true

      - name: Verify all five archives and checksums
        working-directory: release
        run: |
          test "$(find . -name '*.sha256' | wc -l)" -eq 5
          cat *.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.bump.outputs.tag }}
        run: |
          ARGS=()
          [[ "$TAG" == *-* ]] && ARGS+=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.tar.gz release/*.zip release/SHA256SUMS --clobber
          else
            gh release create "$TAG" release/*.tar.gz release/*.zip release/SHA256SUMS \
              --verify-tag --generate-notes --title "$TAG" "${ARGS[@]}"
          fi
