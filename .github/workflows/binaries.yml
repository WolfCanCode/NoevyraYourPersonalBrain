name: Tested native binaries
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: amd64
            ext: ''
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            ext: ''
          - runner: macos-15-intel
            os: darwin
            arch: amd64
            ext: ''
          - runner: macos-15
            os: darwin
            arch: arm64
            ext: ''
          - runner: windows-2025
            os: windows
            arch: amd64
            ext: .exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      GOFLAGS: -mod=readonly
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.20.0'
      - name: Verify locked dependencies
        run: |
          go mod download
          go mod verify
          git diff --exit-code -- go.mod go.sum
      - name: Format and static analysis
        run: |
          UNFORMATTED="$(gofmt -l cmd internal)"
          if [[ -n "$UNFORMATTED" ]]; then echo "$UNFORMATTED"; exit 1; fi
          go vet ./...
      - name: Go tests and race detection
        run: go test -race -count=1 ./...
      - name: JavaScript compatibility baseline
        run: |
          npm test
          npm run check
      - name: Build self-contained executable
        env:
          CGO_ENABLED: '0'
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          EXT: ${{ matrix.ext }}
        run: |
          test "$(go env GOOS)" = "$TARGET_OS"
          test "$(go env GOARCH)" = "$TARGET_ARCH"
          VERSION="dev-${GITHUB_SHA:0:12}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then VERSION="${GITHUB_REF#refs/tags/}"; fi
          echo "BRAIN_VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p build
          go build -mod=readonly -trimpath -ldflags "-s -w -X main.version=$VERSION -X main.commit=$GITHUB_SHA -X main.builtAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o "build/brain$EXT" ./cmd/brain
      - name: Test the exact executable
        env:
          EXT: ${{ matrix.ext }}
        run: node scripts/smoke.mjs "build/brain$EXT"
      - name: Package and checksum
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          EXT: ${{ matrix.ext }}
        run: python scripts/package.py "build/brain$EXT" "$BRAIN_VERSION" "$TARGET_OS" "$TARGET_ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brain-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
