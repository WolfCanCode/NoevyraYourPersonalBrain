name: Tested native binaries
on:
  workflow_call:
    inputs:
      ref:
        description: 'Exact source revision to test and package; defaults to the triggering commit'
        type: string
        required: false
        default: ''
      version:
        description: 'Version to embed (e.g. v0.4.0); falls back to GITHUB_REF for tag-triggered builds'
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: amd64
            ext: ''
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            ext: ''
          - runner: macos-15-intel
            os: darwin
            arch: amd64
            ext: ''
          - runner: macos-15
            os: darwin
            arch: arm64
            ext: ''
          - runner: windows-2025
            os: windows
            arch: amd64
            ext: .exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      GOFLAGS: -mod=readonly
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node 24)
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: go.sum
      - name: Verify locked dependencies
        run: |
          go mod download
          go mod verify
          git diff --exit-code -- go.mod go.sum
      - name: Format and static analysis
        run: |
          UNFORMATTED="$(gofmt -l cmd internal tests)"
          if [[ -n "$UNFORMATTED" ]]; then echo "$UNFORMATTED"; exit 1; fi
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: Go tests and race detection
        run: go test -race -count=1 ./...
      - name: Refresh embedded AAS skills catalog
        run: |
          curl -fsSL https://raw.githubusercontent.com/sickn33/agentic-awesome-skills/main/skills_index.json \
            -o internal/intelligence/skills_index.json
          echo "Catalog size: $(wc -c < internal/intelligence/skills_index.json) bytes"
      - name: Build self-contained executable
        env:
          CGO_ENABLED: '0'
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          EXT: ${{ matrix.ext }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$(go env GOOS)" = "$TARGET_OS"
          test "$(go env GOARCH)" = "$TARGET_ARCH"
          BUILD_COMMIT="$(git rev-parse HEAD)"
          if [[ -n "$RELEASE_VERSION" ]]; then
            VERSION="$RELEASE_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="dev-${BUILD_COMMIT:0:12}"
          fi
          echo "BRAIN_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BRAIN_COMMIT=$BUILD_COMMIT" >> "$GITHUB_ENV"
          mkdir -p build
          go build -mod=readonly -trimpath -ldflags "-s -w -X main.version=$VERSION -X main.commit=$BUILD_COMMIT -X main.builtAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o "build/brain$EXT" ./cmd/brain
      - name: Test the exact executable
        env:
          EXT: ${{ matrix.ext }}
        run: BRAIN_TEST_BINARY="build/brain$EXT" BRAIN_EXPECT_VERSION="$BRAIN_VERSION" BRAIN_EXPECT_COMMIT="$BRAIN_COMMIT" go test -count=1 -v ./tests
      - name: Package and checksum
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          EXT: ${{ matrix.ext }}
        run: go run ./cmd/package "build/brain$EXT" "$BRAIN_VERSION" "$TARGET_OS" "$TARGET_ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brain-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
